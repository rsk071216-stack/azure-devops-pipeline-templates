# Job: full-history secret scan with gitleaks.

parameters:
  - name: name
    displayName: Job identifier
    type: string
    default: SecretScan
  - name: pool
    displayName: Agent pool
    type: object
    default:
      vmImage: ubuntu-24.04
  - name: dependsOn
    displayName: Jobs this job depends on
    type: object
    default: []
  - name: failOnFindings
    displayName: Fail the job when a secret is detected
    type: boolean
    default: true
  - name: buildTags
    displayName: Tags added to the pipeline run (audit trail of governance and template version)
    type: object
    default: []
  - name: timeoutInMinutes
    displayName: Job timeout
    type: number
    default: 15

jobs:
  - job: ${{ parameters.name }}
    displayName: Secret scan (gitleaks)
    pool: ${{ parameters.pool }}
    dependsOn: ${{ parameters.dependsOn }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false
      - ${{ each tag in parameters.buildTags }}:
          - bash: echo "##vso[build.addbuildtag]${RUN_TAG}"
            displayName: Tag run '${{ tag }}'
            env:
              RUN_TAG: ${{ tag }}
      - template: ../steps/gitleaks-scan.yml
        parameters:
          scanMode: git
          failOnFindings: ${{ parameters.failOnFindings }}
